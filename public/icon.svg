<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Emblem Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="180" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Cooperative Emblem Center: Shield, Joined Hands, and Gear -->
  <g transform="translate(256, 256) scale(0.92)" text-anchor="middle">
    <!-- Gear / Industry Backbone -->
    <path d="M-40,-130 L-25,-130 L-20,-112 C-10,-115 0,-116 10,-116 C20,-116 30,-115 40,-112 L45,-130 L60,-130 L62,-105 C75,-98 86,-89 95,-78 L118,-86 L128,-75 L116,-54 C122,-42 126,-29 128,-15 L146,-10 L146,10 L128,15 C126,29 122,42 116,54 L128,75 L118,86 L95,78 C86,89 75,98 62,105 L60,130 L45,130 L40,112 C30,115 20,116 10,116 C0,116 -10,115 -20,112 L-25,130 L-40,130 L-42,105 C-55,98 -66,89 -75,78 L-98,86 L-108,75 L-96,54 C-102,42 -106,29 -108,15 L-126,10 L-126,-10 L-108,-15 C-106,-29 -102,-42 -96,-54 L-108,-75 L-98,-86 L-75,-78 C-66,-89 -55,-98 -42,-105 Z" fill="#047857" opacity="0.45"/>

    <!-- Central Protective Shield -->
    <path d="M0,-100 C70,-100 105,-75 105,10 C105,75 50,115 0,135 C-50,115 -105,75 -105,10 C-105,-75 -70,-100 0,-100 Z" fill="#022c22" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>

    <!-- Clasped Cooperative Hands Vector -->
    <path d="M-55,-10 C-45,-30 -20,-45 0,-45 C20,-45 45,-30 55,-10 C45,15 25,35 0,55 C-25,35 -45,15 -55,-10 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-10" r="14" fill="#064e3b" />
    
    <!-- Rising Wheat Sheaves / Prosperity -->
    <path d="M-65,45 C-80,20 -80,-20 -60,-50 C-68,-25 -65,10 -50,35 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M65,45 C80,20 80,-20 60,-50 C68,-25 65,10 50,35 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Cooperative Ribbon Star -->
    <polygon points="0,75 6,90 22,90 10,100 14,115 0,105 -14,115 -10,100 -22,90 -6,90" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: SAHAKAR SEVA -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="4">SAHAKAR SEVA</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="2">LABOUR COOPERATIVE FEDERATION</text>
</svg>
